# Levanta la plataforma completa con un solo comando:  docker compose up -d --build
# Lee las variables desde el archivo .env (copiar de .env.example).
#
#   web    -> la aplicación Django servida con Gunicorn   (http://localhost:8000)
#   db     -> PostgreSQL local con sus datos en un volumen
#   envios -> envía valoraciones y recordatorios por correo cada 15 minutos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fdvc}
      POSTGRES_USER: ${POSTGRES_USER:-fdvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data   # los datos sobreviven aunque se borre el contenedor
    healthcheck:   # "sano" cuando Postgres ya acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: fdvc-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Por defecto usa el Postgres de arriba. Para usar Supabase, define DATABASE_URL en el .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-fdvc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fdvc}}
    ports:
      - "${PUERTO_WEB:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy   # no arranca hasta que la BD esté lista

  envios:
    image: fdvc-web   # misma imagen que web, otro comando
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-fdvc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fdvc}}
    # Espera a que web aplique las migraciones y luego procesa los envíos cada 15 minutos.
    command: >
      sh -c "sleep 30; while true; do python manage.py procesar_envios; sleep 900; done"
    depends_on:
      - web

volumes:
  datos_postgres:
